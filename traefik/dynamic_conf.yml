# DOMAIN VALUE IS INTENTIONALLY NOT IN THIS PUBLIC REPO.
# gha-deploy.sh restores the real host rules from root-only /root/traefik/dynamic_conf.local.yml
# after every git reset --hard. Keep this placeholder structurally identical to that file.
http:
  routers:
    entertainment:
      rule: "Host(`REPLACED-BY-DEPLOY-SCRIPT.example.com`)"
      service: entertainment
      entryPoints:
        - websecure
      tls:
        certResolver: myresolver
      middlewares:
        - redirect-to-https
        - security-headers
        - large-upload

    entertainment-http:
      rule: "Host(`REPLACED-BY-DEPLOY-SCRIPT.example.com`)"
      service: entertainment
      entryPoints:
        - web
      middlewares:
        - redirect-to-https

    api:
      rule: "Host(`REPLACED-BY-DEPLOY-SCRIPT.example.com`) && PathPrefix(`/dashboard`)"
      service: "api@internal"
      entrypoints:
        - websecure
      middlewares:
        - auth
      tls:
        certResolver: myresolver

  services:
    entertainment:
      loadBalancer:
        servers:
          - url: "http://nginx:80"  # Now points to nginx instead of web

  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: "https"
        permanent: true

    security-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000  # 1 year
        customResponseHeaders:
          X-Content-Type-Options: "nosniff"
          Referrer-Policy: "strict-origin-when-cross-origin"

    auth:
      basicAuth:
        users:
          # Generate these with: htpasswd -nb admin secure_password
          # The below is example only - replace with your own credentials!
          - "REPLACE-WITH-HTPASSWD-LINE-FROM-ROOT-OVERRIDE"  

    large-upload:
      buffering:
        maxRequestBodyBytes: 524288000  # 500 MB

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
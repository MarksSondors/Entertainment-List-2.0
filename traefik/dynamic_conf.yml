http:
  routers:
    entertainment:
      # The domain comes from DOMAIN in .env, passed to the traefik container by
      # docker-compose.yaml; the file provider renders these Go templates on load.
      rule: "Host(`{{ env "DOMAIN" | trimPrefix "https://" | trimPrefix "http://" | trimSuffix "/" }}`)"
      service: entertainment
      entryPoints:
        - websecure
      tls:
        certResolver: myresolver
      middlewares:
        - redirect-to-https
        - security-headers
        - large-upload
        - compress

    # Background polling (activity feed refresh, import progress) and health
    # checks: same as the main site route, but kept out of the access log so
    # the stats show what people actually do.
    entertainment-quiet:
      rule: "Host(`{{ env "DOMAIN" | trimPrefix "https://" | trimPrefix "http://" | trimSuffix "/" }}`) && (Path(`/activity/recent/`) || Path(`/movies/task-status/`) || Path(`/tvshows/task-status/`) || Path(`/healthz`))"
      priority: 900
      service: entertainment
      entryPoints:
        - websecure
      tls:
        certResolver: myresolver
      middlewares:
        - redirect-to-https
        - security-headers
        - large-upload
        - compress
      observability:
        accessLogs: false

    # Vulnerability scanners probing for PHP/WordPress/dotfiles: rejected with
    # 403 before reaching Django, and not logged. No real page matches these.
    block-scanners:
      rule: "PathRegexp(`(?i)(\\.(php\\d?|asp|aspx|jsp|cgi|env|ini|bak|old|sql|swp|git)$|^/(wp-|wordpress|xmlrpc|phpmyadmin|pma/|cgi-bin|vendor/|\\.git|\\.env|\\.aws|\\.ssh|\\.svn|\\.hg|\\.ds_store|boaform|actuator|hnap1|owa/|autodiscover))`)"
      priority: 3000
      service: noop@internal
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - deny-all
      observability:
        accessLogs: false

    block-scanners-http:
      rule: "PathRegexp(`(?i)(\\.(php\\d?|asp|aspx|jsp|cgi|env|ini|bak|old|sql|swp|git)$|^/(wp-|wordpress|xmlrpc|phpmyadmin|pma/|cgi-bin|vendor/|\\.git|\\.env|\\.aws|\\.ssh|\\.svn|\\.hg|\\.ds_store|boaform|actuator|hnap1|owa/|autodiscover))`)"
      priority: 3000
      service: noop@internal
      entryPoints:
        - web
      middlewares:
        - deny-all
      observability:
        accessLogs: false

    # Anything not addressed to the site's domain (scanners hitting the bare IP,
    # random Host headers): rejected and not logged. Lowest priority, so every
    # real route wins.
    unknown-host:
      rule: "PathPrefix(`/`)"
      priority: 1
      service: noop@internal
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - deny-all
      observability:
        accessLogs: false

    unknown-host-http:
      rule: "PathPrefix(`/`)"
      priority: 1
      service: noop@internal
      entryPoints:
        - web
      middlewares:
        - deny-all
      observability:
        accessLogs: false

    entertainment-http:
      rule: "Host(`{{ env "DOMAIN" | trimPrefix "https://" | trimPrefix "http://" | trimSuffix "/" }}`)"
      service: entertainment
      entryPoints:
        - web
      middlewares:
        - redirect-to-https

    www-redirect-https:
      rule: "Host(`www.{{ env "DOMAIN" | trimPrefix "https://" | trimPrefix "http://" | trimSuffix "/" }}`)"
      service: noop@internal
      entryPoints:
        - websecure
      middlewares:
        - www-to-apex
      tls:
        certResolver: myresolver

    www-redirect-http:
      rule: "Host(`www.{{ env "DOMAIN" | trimPrefix "https://" | trimPrefix "http://" | trimSuffix "/" }}`)"
      service: noop@internal
      entryPoints:
        - web
      middlewares:
        - www-to-apex

    api:
      # Traefik dashboard (/traefik/dashboard/) plus the /traefik/api/ data it loads;
      # see --api.basePath in docker-compose.yaml. The old /dashboard URL redirects here.
      rule: "Host(`{{ env "DOMAIN" | trimPrefix "https://" | trimPrefix "http://" | trimSuffix "/" }}`) && (PathPrefix(`/traefik`) || PathPrefix(`/dashboard`))"
      service: "api@internal"
      entrypoints:
        - websecure
      middlewares:
        - auth
        - dashboard-redirect
      tls:
        certResolver: myresolver

    # GoAccess traffic report (served by nginx) and its live-update WebSocket.
    # Explicit priorities: the dashboard rule above also matches /traefik/... and,
    # being longer, would otherwise win.
    stats:
      rule: "Host(`{{ env "DOMAIN" | trimPrefix "https://" | trimPrefix "http://" | trimSuffix "/" }}`) && PathPrefix(`/traefik/stats`)"
      priority: 1000
      service: entertainment
      entrypoints:
        - websecure
      middlewares:
        - auth
        - stats-slash
      tls:
        certResolver: myresolver

    stats-ws:
      rule: "Host(`{{ env "DOMAIN" | trimPrefix "https://" | trimPrefix "http://" | trimSuffix "/" }}`) && Path(`/traefik/stats/ws`)"
      priority: 1100
      service: goaccess
      entrypoints:
        - websecure
      middlewares:
        - auth
      tls:
        certResolver: myresolver

  services:
    entertainment:
      loadBalancer:
        servers:
          - url: "http://nginx:80"  # Now points to nginx instead of web
        # Shows the backend as UP/DOWN in the dashboard. A failing check takes the
        # server out of rotation (503) until /healthz (DB + cache) passes again.
        healthCheck:
          path: /healthz
          # Django only accepts its own domain in the Host header
          hostname: "{{ env "DOMAIN" | trimPrefix "https://" | trimPrefix "http://" | trimSuffix "/" }}"
          interval: 15s
          timeout: 5s

    goaccess:
      loadBalancer:
        servers:
          - url: "http://goaccess:7890"

  middlewares:
    # /traefik, /traefik/dashboard (no trailing slash) and the old /dashboard URLs
    # all land on the dashboard; Traefik only serves it at .../dashboard/
    dashboard-redirect:
      redirectRegex:
        regex: "^(https?://[^/]+)/(?:traefik/?|traefik/dashboard|dashboard.*)$"
        replacement: "${1}/traefik/dashboard/"

    # /traefik/stats -> /traefik/stats/ (nginx only serves the report with the slash)
    stats-slash:
      redirectRegex:
        regex: "^(https?://[^/]+/traefik/stats)$"
        replacement: "${1}/"

    redirect-to-https:
      redirectScheme:
        scheme: "https"
        permanent: true

    security-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000  # 1 year
        customResponseHeaders:
          X-Content-Type-Options: "nosniff"
          Referrer-Policy: "strict-origin-when-cross-origin"

    www-to-apex:
      redirectRegex:
        regex: "^https?://www\\.[a-z0-9.-]+(.*)"
        replacement: "https://{{ env "DOMAIN" | trimPrefix "https://" | trimPrefix "http://" | trimSuffix "/" }}${1}"
        permanent: true

    auth:
      basicAuth:
        users:
          # Generate these with: htpasswd -nb admin secure_password
          # The below is example only - replace with your own credentials!
          - "makar:$apr1$U8q6MhEp$QisLJfU3aKy1I6Z7ZYgi30"

    large-upload:
      buffering:
        maxRequestBodyBytes: 524288000  # 500 MB

    # gzip/brotli/zstd for text responses from Django; images, video and
    # downloads are already compressed so they're left alone.
    compress:
      compress:
        includedContentTypes:
          - text/html
          - text/css
          - text/plain
          - text/javascript
          - application/javascript
          - application/json
          - application/manifest+json
          - application/xml
          - text/xml
          - image/svg+xml

    # Rejects every client (403); used for the scanner and unknown-host routers.
    deny-all:
      ipAllowList:
        sourceRange:
          - "127.0.0.1/32"

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

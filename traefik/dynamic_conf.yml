http:
  routers:
    entertainment:
      # DOMAIN VALUE IS INTENTIONALLY NOT IN THIS PUBLIC REPO.
      # /etc/traefik/dynamic_conf.yml is bind-mounted from the live tree; the deploy
      # script (gha-deploy.sh) restores the real host rules from a root-only file
      # (/root/traefik/dynamic_conf.local.yml) after every `git reset --hard`.
      # Keep this file's placeholder in sync with that local file's STRUCTURE.
      rule: "Host(`entertaint.men`)"
      service: entertainment
      entryPoints:
        - websecure
      tls:
        certResolver: myresolver
      middlewares:
        - redirect-to-https
        - security-headers
        - large-upload

    entertainment-http:
      rule: "Host(`entertaint.men`)"
      service: entertainment
      entryPoints:
        - web
      middlewares:
        - redirect-to-https

    www-redirect-https:
      rule: "Host(`www.REPLACED-BY-DEPLOY-SCRIPT.example.com`)"
      service: noop@internal
      entryPoints:
        - websecure
      middlewares:
        - www-to-apex
      tls:
        certResolver: myresolver

    www-redirect-http:
      rule: "Host(`www.REPLACED-BY-DEPLOY-SCRIPT.example.com`)"
      service: noop@internal
      entryPoints:
        - web
      middlewares:
        - www-to-apex

    api:
      rule: "Host(`entertaint.men`) && PathPrefix(`/dashboard`)"
      service: "api@internal"
      entrypoints:
        - websecure
      middlewares:
        - auth
      tls:
        certResolver: myresolver

  services:
    entertainment:
      loadBalancer:
        servers:
          - url: "http://nginx:80"  # Now points to nginx instead of web

  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: "https"
        permanent: true

    security-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000  # 1 year
        customResponseHeaders:
          X-Content-Type-Options: "nosniff"
          Referrer-Policy: "strict-origin-when-cross-origin"

    www-to-apex:
      redirectRegex:
        regex: "^https?://www\\.[a-z0-9.-]+(.*)"
        replacement: "https://REPLACED-BY-DEPLOY-SCRIPT.example.com${1}"
        permanent: true

    auth:
      basicAuth:
        users:
          # Generate these with: htpasswd -nb admin secure_password
          # The below is example only - replace with your own credentials!
          - "makar:$apr1$U8q6MhEp$QisLJfU3aKy1I6Z7ZYgi30"

    large-upload:
      buffering:
        maxRequestBodyBytes: 524288000  # 500 MB

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

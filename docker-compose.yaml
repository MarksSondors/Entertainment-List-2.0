services:
  web:
    build:
      context: ./entertainment
      dockerfile: Dockerfile
    volumes:
      - ./entertainment:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - webnet
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      # migrate + collectstatic run before gunicorn starts
      start_period: 120s

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - goaccess_report:/srv/goaccess:ro
    depends_on:
      - web
    networks:
      - webnet
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    env_file:
      - .env
    # Bind to loopback only: the app talks to postgres over the internal
    # docker network (`postgres` service name), so a public 0.0.0.0 binding
    # served no purpose except exposing the DB to the whole internet.
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - webnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: "redis:alpine"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - webnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  traefik:
    image: "traefik:v3.7.6"
    command:
      - "--providers.docker=true"
      - "--providers.file.filename=/etc/traefik/dynamic_conf.yml"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=your-actual-email@example.com"
      - "--certificatesresolvers.myresolver.acme.storage=/acme.json"
      - "--api.dashboard=true"
      # Dashboard at /traefik/dashboard/ and its data API at /traefik/api/, so it
      # doesn't collide with the Django app's own /api/ routes
      - "--api.basePath=/traefik"
      - "--log.level=INFO"
      # One JSON line per request to the site, written to a file GoAccess reads
      # (/traefik/stats/). Django tags responses with the signed-in user and the
      # route that handled them (X-Entlist-User / X-Entlist-View). Raw log:
      # `docker compose exec goaccess tail -f /var/log/traefik/access.log`
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--accesslog.format=json"
      - "--accesslog.fields.headers.defaultmode=drop"
      - "--accesslog.fields.headers.names.User-Agent=keep"
      - "--accesslog.fields.headers.names.Referer=keep"
      - "--accesslog.fields.headers.names.X-Entlist-User=keep"
      - "--accesslog.fields.headers.names.X-Entlist-View=keep"
    ports:
      - "80:80"
      - "443:443"  # HTTPS
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - ./traefik/acme.json:/acme.json
      - ./traefik/dynamic_conf.yml:/etc/traefik/dynamic_conf.yml
      - traefik_logs:/var/log/traefik
    networks:
      - webnet
    restart: unless-stopped
    # Rotate container logs so the access log can't fill the disk
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      - DOMAIN=${DOMAIN:?DOMAIN must be set in .env}

  # Live traffic dashboard at /traefik/stats/ built from Traefik's access log
  goaccess:
    image: allinurl/goaccess:1.12
    entrypoint: ["/bin/sh", "/goaccess.sh"]
    volumes:
      - ./traefik/goaccess.sh:/goaccess.sh:ro
      - ./traefik/goaccess-labels.js:/goaccess-labels.js:ro
      - traefik_logs:/var/log/traefik
      - goaccess_data:/data
      - goaccess_report:/report
    networks:
      - webnet
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    environment:
      - DOMAIN=${DOMAIN:?DOMAIN must be set in .env}

networks:
  webnet:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  static_volume:
  media_volume:
  traefik_logs:
  goaccess_data:
  goaccess_report:
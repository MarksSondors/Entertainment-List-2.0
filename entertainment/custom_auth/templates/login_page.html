{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Sign In | Entertainment List</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EntList">
    <meta name="description" content="Sign in to Entertainment List — track movies, TV, books, music and games in one place.">
    <meta name="theme-color" content="#008080" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#032028" media="(prefers-color-scheme: dark)">

    <!-- Favicon -->
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'favicon/favicon.ico' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'favicon/apple-touch-icon.png' %}">

    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body{% if login_error %} data-login-error="true"{% endif %}>
  <div class="desktop">
    <main class="window{% if login_error %} shake{% endif %}" id="login-window" aria-labelledby="login-title">
      <div class="title-bar">
        <span class="title-bar-text" id="login-title">Welcome to Entertainment List</span>
        <span class="title-bar-controls" aria-hidden="true">
          <span class="tb-btn tb-min"></span>
          <span class="tb-btn tb-max"></span>
          <span class="tb-btn tb-close"></span>
        </span>
      </div>

      <div class="window-body">
        <div class="brand">
          <img class="brand-logo" src="{% static 'images/logo.png' %}" alt="" width="56" height="56">
          <span class="brand-mark">entertaint.men</span>
          <p class="brand-tagline">Movies, shows, books, music and games — one list.</p>
        </div>

        <div class="alert" id="login-alert" role="alert" hidden>
          <svg class="alert-icon" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="10" cy="10" r="9" fill="var(--error-accent)"/>
            <circle cx="10" cy="10" r="7.5" fill="none" stroke="var(--on-error)" stroke-width="1.2" opacity="0.85"/>
            <path d="M7 7l6 6M13 7l-6 6" stroke="var(--on-error)" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <p class="alert-text" id="login-alert-text">Incorrect username or password.</p>
        </div>

        <form id="login-form" method="post" action="{% url 'login_request' %}">
          {% csrf_token %}
          <div class="field">
            <label class="field-label" for="username">Username</label>
            <div class="field-row">
              <input class="field-input" type="text" id="username" name="username"
                     autocomplete="username" autocapitalize="none" autocorrect="off"
                     spellcheck="false" enterkeyhint="next"
                     aria-describedby="username-error" required{% if login_error %} aria-invalid="true"{% endif %}>
            </div>
            <p class="field-error" id="username-error">Enter your username.</p>
          </div>

          <div class="field">
            <label class="field-label" for="password">Password</label>
            <div class="field-row">
              <input class="field-input" type="password" id="password" name="password"
                     autocomplete="current-password" enterkeyhint="go"
                     aria-describedby="password-error caps-warning" required{% if login_error %} aria-invalid="true"{% endif %}>
              <button class="btn btn-secondary" type="button" id="toggle-password"
                       aria-label="Show password" aria-pressed="false">Show</button>
            </div>
            <p class="field-error" id="caps-warning">Caps Lock is on.</p>
            <p class="field-error" id="password-error">Enter your password.</p>
          </div>

          <div class="options-row">
            <label class="checkbox">
              <input type="checkbox" id="remember" name="remember" checked>
              <span class="checkbox-label">Remember me</span>
            </label>
          </div>

          <button class="btn btn-primary" type="submit" id="login-submit">Sign In</button>
        </form>
      </div>

      <div class="status-bar">
        <div class="status-bar-field" id="status" role="status">Ready</div>
        <div class="status-bar-field">© 2025 Entertainment List</div>
      </div>
    </main>
  </div>

  <script>
    (function () {
      'use strict';

      var form = document.getElementById('login-form');
      var alertBox = document.getElementById('login-alert');
      var userInput = document.getElementById('username');
      var passInput = document.getElementById('password');
      var statusEl = document.getElementById('status');
      var loginWindow = document.getElementById('login-window');
      var capsWarning = document.getElementById('caps-warning');

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function showAlert(message) {
        if (message) {
          document.getElementById('login-alert-text').textContent = message;
          alertBox.hidden = false;
        } else {
          alertBox.hidden = true;
        }
      }

      function setFieldError(input, visible) {
        var errorEl = document.getElementById(input.id + '-error');
        input.setAttribute('aria-invalid', visible ? 'true' : 'false');
        if (errorEl) errorEl.classList.toggle('is-visible', visible);
      }

      function clearErrors() {
        setFieldError(userInput, false);
        setFieldError(passInput, false);
        showAlert(null);
      }

      form.addEventListener('submit', function (event) {
        clearErrors();

        var username = userInput.value.trim();
        var password = passInput.value;

        if (!username || !password) {
          event.preventDefault();
          if (!username) setFieldError(userInput, true);
          if (!password) setFieldError(passInput, true);
          showAlert('Please enter your username and password.');
          setStatus('Sign-in failed');
          (username ? passInput : userInput).focus();
        } else {
          var submitBtn = document.getElementById('login-submit');
          submitBtn.disabled = true;
          submitBtn.textContent = 'Signing in…';
          setStatus('Signing in…');
        }
      });

      userInput.addEventListener('input', function () { setFieldError(userInput, false); });
      passInput.addEventListener('input', function () { setFieldError(passInput, false); });

      function updateCapsWarning(event) {
        var on = false;
        try { on = !!event && typeof event.getModifierState === 'function' && event.getModifierState('CapsLock'); } catch (e) {}
        capsWarning.classList.toggle('is-visible', on);
      }
      passInput.addEventListener('keyup', updateCapsWarning);
      passInput.addEventListener('blur', function () { capsWarning.classList.remove('is-visible'); });

      var toggleBtn = document.getElementById('toggle-password');
      toggleBtn.addEventListener('click', function () {
        var revealed = passInput.type === 'password';
        passInput.type = revealed ? 'text' : 'password';
        toggleBtn.textContent = revealed ? 'Hide' : 'Show';
        toggleBtn.setAttribute('aria-label', revealed ? 'Hide password' : 'Show password');
        toggleBtn.setAttribute('aria-pressed', revealed ? 'true' : 'false');
        passInput.focus();
      });

      // Server-side auth failure: alert + window shake, focus back into the password field.
      {% if login_error %}
      showAlert('Incorrect username or password. Check your details and try again.');
      setStatus('Sign-in failed');
      passInput.focus();
      passInput.select();
      passInput.addEventListener('input', function () { loginWindow.classList.remove('shake'); });
      {% endif %}
    })();
  </script>
</body>
</html>

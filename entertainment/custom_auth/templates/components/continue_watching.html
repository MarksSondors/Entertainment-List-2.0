<!-- Continue Watching: in-progress TV shows, most recently watched first. Filled from
     /api/watchlist/?continue_watching=1; styles are .el-cw* in static/css/el/components.css. -->
<div class="window el-cw" id="continueWatchingSection" hidden>
    <div class="title-bar">
        <span class="title-bar-text" id="continueWatchingTitle">Continue Watching</span>
        <div class="title-bar-controls">
            <button type="button" aria-label="Minimize" id="continueWatchingToggle"
                    aria-expanded="true" aria-controls="continueWatchingContent"></button>
            <button type="button" aria-label="Maximize"></button>
            <button type="button" aria-label="Close"></button>
        </div>
    </div>
    <div class="window-body el-cw-body" id="continueWatchingContent">
        <div class="el-cw-row" id="continueWatchingGrid" role="list"></div>
    </div>
</div>

<script>
(function () {
    const STALE_DAYS = 183;          // untouched this long: behind the "Not watched lately" tile
    const COLLAPSED = 'el-cw-collapsed';
    const section = document.getElementById('continueWatchingSection');
    const grid = document.getElementById('continueWatchingGrid');
    const body = document.getElementById('continueWatchingContent');
    const toggle = document.getElementById('continueWatchingToggle');
    const title = document.getElementById('continueWatchingTitle');
    if (!section) return;

    const el = (tag, cls, text) => {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
    };
    const code = n => `S${n.season} E${n.episode}`;
    const daysSince = iso => iso ? (Date.now() - Date.parse(iso)) / 864e5 : Infinity;

    function setCollapsed(collapsed) {
        body.hidden = collapsed;
        toggle.setAttribute('aria-label', collapsed ? 'Restore' : 'Minimize');
        toggle.setAttribute('aria-expanded', String(!collapsed));
        try { collapsed ? localStorage.setItem(COLLAPSED, '1') : localStorage.removeItem(COLLAPSED); } catch (e) { /* private mode */ }
    }
    toggle.addEventListener('click', () => setCollapsed(!body.hidden));

    function card(row) {
        const item = row.item, next = row.next_episode, pct = Math.round(row.progress);
        const a = el('a', 'el-card');
        a.href = `/tvshows/${item.media_tmdb_id}/`;
        a.setAttribute('role', 'listitem');
        if (next) a.title = `${item.media_title}: ${code(next)}${next.title ? ' · ' + next.title : ''}`;

        if (item.media_poster) {
            const img = el('img', 'el-card-pic');
            img.src = item.media_poster; img.alt = ''; img.loading = 'lazy'; img.decoding = 'async';
            img.width = 104; img.height = 156;
            a.append(img);
        } else {
            a.append(el('span', 'el-card-pic is-empty', item.media_title));
        }
        const body = el('span', 'el-card-body');
        body.append(el('span', 'el-card-title', item.media_title));
        if (next) body.append(el('span', 'el-card-meta', code(next) + (next.runtime ? ` · ${next.runtime}m` : '')));

        const bar = el('span', 'el-progress');
        bar.setAttribute('role', 'progressbar');
        bar.setAttribute('aria-valuemin', '0');
        bar.setAttribute('aria-valuemax', '100');
        bar.setAttribute('aria-valuenow', String(pct));
        bar.setAttribute('aria-label', `${pct}% watched`);
        const fill = el('i');
        fill.style.width = `${Math.min(100, Math.max(0, row.progress))}%`;
        bar.append(fill);
        body.append(bar);
        a.append(body);
        return a;
    }

    function render(rows) {
        const recent = rows.filter(r => daysSince(r.last_watched) <= STALE_DAYS);
        const stale = rows.filter(r => daysSince(r.last_watched) > STALE_DAYS);
        title.textContent = `Continue Watching (${rows.length})`;
        grid.replaceChildren(...recent.map(card));
        if (stale.length) {
            const more = el('button', 'el-cw-more');
            more.type = 'button';
            more.append(el('b', null, '›'), el('span', null, `Not watched lately (${stale.length})`));
            more.addEventListener('click', () => {
                more.replaceWith(...stale.map(card));
                if (grid.children[recent.length]) grid.children[recent.length].focus();
            });
            grid.append(more);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        fetch('/api/watchlist/?continue_watching=1')
            .then(r => r.json())
            .then(data => {
                const rows = data.continue_watching || [];
                if (!rows.length) return;          // nothing in progress: the window stays hidden
                render(rows);
                let collapsed = false;
                try { collapsed = localStorage.getItem(COLLAPSED) === '1'; } catch (e) { /* private mode */ }
                setCollapsed(collapsed);
                section.hidden = false;
            })
            .catch(err => console.error('Error loading continue watching:', err));
    });
})();
</script>

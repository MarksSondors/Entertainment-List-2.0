{% extends "components/base.html" %}

{% block title %}Not Found | Entertainment List{% endblock %}

{% block content %}
<style>
    .nf-container {
        max-width: 480px;
        margin: 60px auto;
        font-family: 'Pixelated MS Sans Serif', Arial, sans-serif;
    }
    /* colours: site palette (static/css/theme.css), both themes */
    .nf-window {
        border: 2px outset var(--el-face);
        background: var(--el-face);
        box-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    .nf-titlebar {
        background: linear-gradient(90deg, var(--el-title-a), var(--el-title-b));
        color: #fff;
        padding: 3px 5px;
        font-weight: bold;
        display: flex;
        justify-content: space-between;
    }
    .nf-body {
        padding: 18px 16px;
        text-align: center;
        color: var(--el-text);
    }
    .nf-body p { margin: 10px 0; }
    .nf-btn {
        display: inline-block;
        margin-top: 12px;
        padding: 4px 18px;
        background: var(--el-face);
        border: 2px outset var(--el-highlight);
        color: var(--el-text);
        text-decoration: none;
        font-size: 13px;
    }
    .nf-btn:active { border-style: inset; }
</style>

<div class="nf-container">
    <div class="nf-window">
        <div class="nf-titlebar">
            <span>Error</span>
            <span>&#9633;&#10005;</span>
        </div>
        <div class="nf-body">
            <p><strong>404 &mdash; Not Found</strong></p>
            <p>This title doesn't exist (or it was removed from its database).</p>
            <a href="/" class="nf-btn">OK</a>
        </div>
    </div>
</div>
{% endblock %}

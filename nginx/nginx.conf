# Resolve "web" through Docker's DNS at request time (not once at startup), so a
# recreated web container with a new IP doesn't leave nginx proxying to a stale one.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    client_max_body_size 500M;

    # Container healthcheck (answered by nginx itself)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Serve media files
    location /media/ {
        alias /app/media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Serve static files
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The service worker must NEVER be cached long: browsers check it for
    # updates on navigation, and a 1y-immutable header pins the old SW on
    # phones forever (stale pages that ignore every deploy).
    location = /static/sw.js {
        alias /app/staticfiles/sw.js;
        add_header Cache-Control "no-cache";
        access_log off;
    }

    # Proxy all other requests to Django
    location / {
        set $django_upstream http://web:8000;
        proxy_pass $django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Pass through the proto Traefik saw (https). Replacing it with $scheme
        # would always report "http" to Django, which breaks SECURE_SSL_REDIRECT
        # (Django would redirect https traffic to https forever).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
        
        # Increase proxy timeouts for long requests
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Handle favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
